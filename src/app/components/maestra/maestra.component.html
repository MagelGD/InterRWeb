
<div style="margin-bottom: 16px;">
  <button mat-raised-button color="primary" (click)="openCreateStudentModal()">Crear Estudiante</button>
</div>
<div class="mat-elevation-z8">
    <table mat-table [dataSource]="data" matSort class="mat-table">
  
      <!-- Columna ID -->
      <ng-container matColumnDef="Numero Documento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Numero Documento </th>
        <td mat-cell *matCellDef="let element"> {{element.numeroDocumento}} </td>
      </ng-container>
  
      <!-- Columna Nombre -->
      <ng-container matColumnDef="Primer Nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Primer Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.primerNombre}} </td>
      </ng-container>
  
      <!-- Columna Descripción -->
      <ng-container matColumnDef="Primer Apellido">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Primer Apellido </th>
        <td mat-cell *matCellDef="let element"> {{element.segundoNombre}} </td>
      </ng-container>
  
      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <button mat-button color="primary" (click)="editar(element)">Editar</button>
          <button mat-button color="warn" (click)="eliminar(element)">Eliminar</button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
